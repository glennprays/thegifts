name: Production Deployment

on:
  workflow_run:
    workflows: ["Build Production Docker Image"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }} 
      SSH_USER: ${{ secrets.SSH_USER }}
      DOCKER_IMAGE: bold-plastic
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }} 
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: develop

      - name: Install Cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Set up SSH for Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat <<EOF > ~/.ssh/config
          Host server
              ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
              HostName ${SSH_HOST}
              User ${SSH_USER}
              StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: SSH into NixOS Host and Deploy
        run: |
          rsync -avz -L misc/production/ server:${DEPLOY_DIR}
          ssh server "cd ${DEPLOY_DIR} && make update-image"
